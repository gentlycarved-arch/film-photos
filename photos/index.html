<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film — Tahreem Rehman</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">
  <div class="exposures" id="exposures"></div>
  <div class="grain"></div>
</div>

<div class="sheet" id="sheet"></div>

<div class="viewer" id="viewer">
  <div class="viewer-frame" id="viewerFrame">
    <img id="viewerImg" src="" alt="">
    <img id="viewerImgB" src="" alt="">
  </div>
  <div class="viewer-label" id="viewerLabel"></div>
</div>

<nav class="nav" id="nav">
  <div class="nav-group" id="views">
    <button class="nav-btn active" data-view="exposure">double exposure</button>
    <button class="nav-btn" data-view="sheet">grid</button>
  </div>
  <div class="nav-rule"></div>
  <button class="nav-btn active" data-cat="all">all</button>
  <button class="nav-btn" data-cat="landscape">landscape</button>
  <button class="nav-btn" data-cat="portrait">portrait</button>
  <button class="nav-btn" data-cat="italy">italy</button>
  <button class="nav-btn" data-cat="saudi">saudi</button>
  <button class="nav-btn" data-cat="underexposed">underexposed</button>
  <div class="counter" id="counter"></div>
  <div class="hint" id="hint"></div>
</nav>

<script src="app.js"></script>
</body>
</html>
