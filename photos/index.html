<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film — Tahreem Rehman</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="filters" id="filters">
  <button class="vbtn active" data-cat="all">all</button>
  <button class="vbtn" data-cat="italy">italy</button>
  <button class="vbtn" data-cat="saudi">saudi</button>
  <button class="vbtn" data-cat="portrait">portrait</button>
  <button class="vbtn" data-cat="food">food</button>
  <button class="vbtn" data-cat="underexposed">underexposed</button>
  <button class="vbtn" data-cat="overexposed">overexposed</button>
</nav>

<nav class="views" id="views">
  <button class="vbtn active" data-view="expose">double exposure</button>
  <button class="vbtn" data-view="grid">grid</button>
</nav>

<section class="sheet" id="sheet"></section>

<div class="viewer" id="viewer">
  <img id="viewerImg" src="" alt="">
  <div class="viewer-label" id="viewerLabel"></div>
</div>

<main class="canvas" id="canvas">
  <div class="pairbox" id="pairbox">
    <div class="pairclip">
      <div class="plate plate-a" id="plateA"></div>
      <div class="plate plate-b" id="plateB"></div>
      <div class="grain"></div>
    </div>
  </div>
  <div class="readout" id="readout"></div>
</main>

<footer class="rolls">
  <div class="roll" data-slot="a">
    <div class="roll-edge">
      <span class="roll-name">SCAN A</span>
      <button class="shuffle" id="shuffle">randomize</button>
    </div>
    <div class="strip" id="stripA"></div>
  </div>
  <div class="roll" data-slot="b">
    <div class="roll-edge"><span class="roll-name">SCAN B</span></div>
    <div class="strip" id="stripB"></div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
